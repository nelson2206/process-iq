# Cloudflare Worker de ProcessIQ: intermediario con la clave de Anthropic.
# Desplegar (desde esta carpeta):  npx wrangler deploy
# Secretos, NUNCA en este archivo (los carga el administrador):
#   npx wrangler secret put ANTHROPIC_API_KEY
#   npx wrangler secret put ACCESS_CODE
name = "processiq-api"
main = "processiq-api.js"
compatibility_date = "2026-08-01"
workers_dev = true    # segunda direccion en workers.dev: el dominio propio esta bloqueado por Netskope desde la red Indra
preview_urls = false  # sin URLs publicas por version: este Worker guarda la clave

[vars]
# procesos = ProcessIQ; nelson2206.github.io = Radar de Prospectos (usa este mismo intermediario)
ALLOWED_ORIGINS = "https://procesos.mbc-latam.com,https://nelson2206.github.io"

[[routes]]
pattern = "api.mbc-latam.com"
custom_domain = true
